# Include inside the existing HTTPS server block. Each location is dedicated to
# KidBook; /harness/, /new-api/, account and other existing routes are untouched.
location = /kidbook { return 302 /custom; }
location = /kidbook/ { return 302 /custom; }
location = /custom { include /etc/nginx/snippets/kidbook-proxy.conf; }
location = /studio-login { include /etc/nginx/snippets/kidbook-proxy.conf; }
location ^~ /api/local/ { include /etc/nginx/snippets/kidbook-proxy.conf; }
location ^~ /_next/ { include /etc/nginx/snippets/kidbook-proxy.conf; }
location ^~ /fonts/print/ { include /etc/nginx/snippets/kidbook-proxy.conf; }
location ^~ /sample-books/ { include /etc/nginx/snippets/kidbook-proxy.conf; }
location ^~ /gift-books/ { include /etc/nginx/snippets/kidbook-proxy.conf; }
